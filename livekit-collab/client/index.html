<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plate + LiveKit realtime collab</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #e5e5e5; }
      .toolbar button { padding: 4px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
      .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status { font-size: 13px; color: #555; }
      .status .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
      .dot.connected { background: #22c55e; }
      .dot.disconnected { background: #ef4444; }
      .editor-shell { max-width: 760px; margin: 40px auto; padding: 24px; border: 1px solid #e5e5e5; border-radius: 12px; min-height: 400px; }
      .editor-shell [contenteditable]:focus { outline: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
